name: Secret scan

# Backstop for the local .githooks/pre-commit guard: scans every push and PR,
# including commits made on machines where the hook is not installed.
# gitleaks-action is free for personal accounts and public repositories; an
# organisation needs a GITLEAKS_LICENSE secret.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  # gitleaks-action comments on pull requests; without this the PR job fails
  # with "Resource not accessible by integration" (403).
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
